name: Release

# Triggers on:
#   - git tag push (vX.Y.Z) → builds + publishes a versioned release
#   - manual workflow_dispatch → useful for testing the matrix
#
# Matrix:
#   - ubuntu-latest    → x86_64 .deb + .AppImage + .rpm
#   - ubuntu-24.04-arm → aarch64 .deb + .AppImage + .rpm
#   - macos-latest     → aarch64 .dmg + .app.tar.gz
#   - windows-latest   → x64 .msi + .exe
#
# The arm64 Linux target was missing until v0.3.5, and its absence bit exactly
# where it hurts: the machine you would most want to browse RedStars from a
# terminal — a Raspberry Pi, a headless ARM box — was the one with no package.
#
# Built on a NATIVE arm runner (free on public repos) rather than cross-compiled.
# Cross-compiling Tauri to aarch64 means cross-compiling webkit2gtk's whole
# dependency tree, which is a multi-day sysroot project that breaks on every
# upstream bump. A native runner is one line.
#
# Secrets required (GitHub repo settings → Actions → Secrets):
#   - TAURI_SIGNING_PRIVATE_KEY      : minisign-format private key
#   - TAURI_SIGNING_PRIVATE_KEY_PASSWORD : empty string if generated --password ""
# Optional (for OS code-signing):
#   - APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD / APPLE_SIGNING_IDENTITY
#   - APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID  (notarization)
#   - WINDOWS_CERTIFICATE / WINDOWS_CERTIFICATE_PASSWORD

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.3.0)'
        required: true

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'ubuntu-latest'      # x86_64
            args: ''
          - platform: 'ubuntu-24.04-arm'   # aarch64 — native runner, no cross-compile
            args: ''
          - platform: 'macos-latest'
            args: ''
          - platform: 'windows-latest'
            args: ''
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        # Both Linux runners, not just x86_64. Gating on the exact string
        # 'ubuntu-latest' is what silently skipped every dependency on the arm
        # runner and produced a build that failed on the first #include.
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libsoup-3.0-dev \
            patchelf \
            rpm
          # `rpm` package provides rpmbuild on Ubuntu — Tauri uses it to
          # produce the .rpm bundle alongside .deb and .AppImage. Without
          # this, the rpm target silently skips and we ship only .deb.

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          # runner.ARCH, not just runner.os. Both Linux runners report "Linux",
          # so without the arch the x86_64 and aarch64 builds would share one
          # cache — and `src-tauri/target` is full of compiled objects for the
          # WRONG architecture. The linker's complaint about that is not obvious,
          # and it only appears on the runner, which is the worst place to debug.
          key: ${{ runner.os }}-${{ runner.arch }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - run: npm ci

      - name: Build + sign + publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # NB: APPLE_CERTIFICATE / WINDOWS_CERTIFICATE intentionally omitted —
          # passing them empty makes tauri-action attempt a `security import`
          # that fails. Add them back (only) when we have real signing certs.
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: 'Redstars Helper ${{ github.event.inputs.tag || github.ref_name }}'
          releaseBody: |
            See CHANGELOG.md for details.

            **Auto-update:** existing v0.2.0+ installs will pick this up via the Tauri updater.

            ## Install

            Linux ships **x86_64 (amd64)** and **arm64 (aarch64)** — pick your arch.
            `uname -m` tells you: `x86_64` or `aarch64`.

            - **Debian / Ubuntu / Mint** — `sudo apt install ./Redstars.Helper_*_<arch>.deb`
            - **Fedora / RHEL / openSUSE** — `sudo dnf install ./Redstars.Helper-*.<arch>.rpm`
            - **Arch / Nix / Raspberry Pi / unknown Linux** — `chmod +x *.AppImage && ./*.AppImage`
            - **macOS** — open the `.dmg` (Apple Silicon)
            - **Windows** — run the `.msi`

            ## RedStars in a terminal

            `helper.py console` browses RedStars from a headless box — including a
            Raspberry Pi, which is why the arm64 packages exist. `--minitel` for
            40×24, `--accessible` for a numbered list read by a screen reader.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
