[package]
name = "redstars-helper"
version = "0.4.2"
description = "Redstars local helper agent"
authors = ["Redstars"]
edition = "2021"

[lib]
name = "redstars_helper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# tauri-plugin-autostart: registers the binary in the OS autostart
# mechanism (XDG ~/.config/autostart on Linux, login items on macOS,
# registry Run key on Windows). First run enables it; uninstalling
# the helper removes the entry. No systemd unit required.
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Script auto-updater (src/script_updater.rs).
# - reqwest: HTTP client for manifest + script + signature fetch
# - sha2:    SHA-256 sanity check on the downloaded script bytes
# - minisign-verify: Ed25519 signature verification, same algorithm as
#   the Tauri updater plugin so we sign with one minisign key.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json"] }
sha2 = "0.10"
minisign-verify = "0.2"
# Process enumeration for the startup single-instance sweep — find and
# kill any prior helper shell / orphan helper.py before we spawn ours.
# default-features off: we only need the process API, not CPU/disk/net
# probes (keeps the release binary lean).
sysinfo = { version = "0.33", default-features = false, features = ["system"] }

# ── Helper natif (portage de helper.py en Rust, v1.0) ──────────────────────
# Serveur HTTP/HTTPS local /helper/* (src/helper/).
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "time", "process", "sync", "fs", "io-util"] }
axum = "0.8"
axum-server = { version = "0.7", features = ["tls-rustls"] }
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
dirs = "6"
which = "7"
fs2 = "0.4"
# Balance série (CH340/FTDI/CP210x). Sans libudev : énumération inutile, on
# ouvre le port connu, et ça évite une dépendance système au build.
serialport = { version = "4", default-features = false }
regex = "1"
# Client console (src/console/) : terminal portable (raw mode, touches, taille).
crossterm = "0.28"
rpassword = "7"
# Décodeur d'images nn: (src/img/) : ONNX en Rust pur, aucune lib native à livrer.
tract-onnx = "0.21"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
